name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows distribution
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath dis-radio-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dis-radio-windows
          path: dis-radio-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libasound2-dev libpulse-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux distribution
        run: |
          zip -r dis-radio-linux.zip \
            build/linux/x64/release/bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: dis-radio-linux
          path: dis-radio-linux.zip

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dis-radio-windows

      - uses: actions/download-artifact@v4
        with:
          name: dis-radio-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dis-radio-windows.zip
            dis-radio-linux.zip
